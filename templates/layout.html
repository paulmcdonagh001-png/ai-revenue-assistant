<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title or "AI Revenue Assistant" }}</title>
<style>
:root{--bg:#f4f7f5;--panel:#fff;--ink:#14221b;--muted:#6f7b75;--green:#0f5b3a;--green2:#157a4c;--green3:#e8f5ed;--red:#c84a4a;--redbg:#fdeaea;--amber:#b87518;--amberbg:#fff4df;--blue:#3f6fb6;--bluebg:#e9f0fb;--border:#dfe7e2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:var(--ink)}
.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:linear-gradient(180deg,#0a3f2a,#0d5134);color:#fff;padding:22px 16px}.brand{font-weight:800;font-size:18px;margin-bottom:24px}.nav a{display:block;color:#d8eee1;text-decoration:none;padding:10px 12px;border-radius:9px;margin:4px 0}.nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.main{padding:26px 30px;max-width:1350px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center}.tag{background:#fff4c7;color:#795c00;border:1px solid #e9d278;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}
h1{margin:12px 0 4px;font-size:31px}h2{font-size:20px}.sub{color:var(--muted);font-size:14px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}.value{font-size:26px;font-weight:800}.label{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.red{background:var(--redbg);color:var(--red)}.green{background:var(--green3);color:var(--green2)}.amber{background:var(--amberbg);color:var(--amber)}.blue{background:var(--bluebg);color:var(--blue)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}th,td{padding:11px;border-bottom:1px solid var(--border);font-size:13px;text-align:left}th{background:#fafcfb;color:var(--muted)}tr:hover{background:#f8fbf9}
a.row{color:inherit;text-decoration:none}.btn{display:inline-block;border:1px solid var(--border);background:#fff;color:var(--ink);padding:9px 12px;border-radius:9px;text-decoration:none;font-weight:700;cursor:pointer}.btn.primary{background:var(--green2);color:#fff;border-color:var(--green2)}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:9px;background:#fff}.field textarea{min-height:120px}
.notice{padding:12px;border-radius:10px;background:#eef7f1;border:1px solid #c9e2d2;color:#285e40}.warn{padding:12px;border-radius:10px;background:#fff4df;border:1px solid #efd49d;color:#7b5415}.action{padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin:8px 0;background:#fafcfb}.question{padding:10px 0;border-bottom:1px solid var(--border)}.timeline{border-left:2px solid var(--border);padding-left:16px}.event{margin-bottom:18px}.small{font-size:12px;color:var(--muted)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">↗ AI Revenue Assistant</div><div class="nav">
<a href="/">Morning Brief</a><a href="/analyst-lab">AI Analyst Lab</a><a href="/test-inbox">Test Inbox</a><a href="/gmail">Gmail Connection</a><a href="/logout">Log out</a>
</div><div class="small" style="color:#bcd4c5;margin-top:28px">V1 backend demo<br>Protected test environment</div></aside>
<main class="main"><div class="top"><span class="tag">V1 TEST MODE</span><span class="small">No real customer messages are sent</span></div>
{% block content %}{% endblock %}</main></div></body></html>
